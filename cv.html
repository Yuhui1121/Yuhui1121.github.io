<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV — Yuhui Zhang</title>
  <meta name="description" content="Curriculum Vitae of Yuhui Zhang, Ph.D. candidate in Management Science and Systems at the University at Buffalo.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #F7F8FA;
      --surface:   #FFFFFF;
      --ink:       #0B1220;
      --text:      #2F3846;
      --faint:     #5A6472;
      --line:      #E6E9EE;
      --accent:    #1D4ED8;
      --accent-2:  #1739A8;
      --warm:      #EA580C;

      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --display: 'Space Grotesk', 'Inter', sans-serif;
      --body: 'Inter', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: var(--body);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; transition: color .18s ease; }
    a:hover { color: var(--warm); }

    /* ---------- top bar ---------- */
    .bar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .bar-left { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }

    .back {
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--accent);
    }
    .back:hover { color: var(--warm); }

    .bar-title {
      font-family: var(--display);
      font-weight: 600;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin: 0;
    }

    .bar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--accent);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 6px 12px;
      transition: all .18s ease;
    }
    .btn:hover {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }
    .btn-solid {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }
    .btn-solid:hover { background: var(--accent-2); border-color: var(--accent-2); }

    /* ---------- viewer ---------- */
    .viewer {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      background: #5A6472;
    }
    .viewer object,
    .viewer iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* shown only when the browser refuses to embed a PDF (common on mobile) */
    .fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: 100%;
      padding: 40px 24px;
      text-align: center;
      background: var(--bg);
    }
    .fallback p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--faint);
      max-width: 44ch;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    @media (max-width: 560px) {
      .bar { padding: 12px 16px; }
      .bar-title { font-size: 0.94rem; }
    }
  </style>
</head>

<body>

  <header class="bar">
    <div class="bar-left">
      <a href="index.html" class="back">&larr; Back to homepage</a>
      <h1 class="bar-title">Yuhui Zhang — Curriculum Vitae</h1>
    </div>
    <nav class="bar-actions" aria-label="CV actions">
      <a href="documents/CV.pdf?v=20260907" class="btn" target="_blank" rel="noopener">Open PDF</a>
      <a href="documents/CV.pdf?v=20260907" class="btn btn-solid" download="Yuhui_Zhang_CV.pdf">Download</a>
    </nav>
  </header>

  <main class="viewer">
    <object data="documents/CV.pdf?v=20260907#view=FitH" type="application/pdf">
      <div class="fallback">
        <p>Your browser cannot display PDFs inline. Open the file in a new tab or download it instead.</p>
        <a href="documents/CV.pdf?v=20260907" class="btn btn-solid" target="_blank" rel="noopener">Open the CV</a>
      </div>
    </object>
  </main>

</body>
</html>
