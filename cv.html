<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV — Yuhui Zhang</title>
  <meta name="description" content="Curriculum Vitae of Yuhui Zhang, Ph.D. candidate in Management Science and Systems at the University at Buffalo.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #F7F8FA;
      --surface:   #FFFFFF;
      --ink:       #0B1220;
      --text:      #2F3846;
      --faint:     #5A6472;
      --line:      #E6E9EE;
      --accent:    #1D4ED8;
      --accent-2:  #1739A8;
      --warm:      #EA580C;
      --stage:     #4A5260;

      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --display: 'Space Grotesk', 'Inter', sans-serif;
      --body: 'Inter', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: var(--body);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; transition: color .18s ease; }
    a:hover { color: var(--warm); }

    /* ---------- top bar ---------- */
    .bar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .bar-left { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }

    .back {
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--accent);
    }
    .back:hover { color: var(--warm); }

    .bar-title {
      font-family: var(--display);
      font-weight: 600;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin: 0;
    }

    .bar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--accent);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 6px 12px;
      transition: all .18s ease;
    }
    .btn:hover {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }
    .btn-solid {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }
    .btn-solid:hover { background: var(--accent-2); border-color: var(--accent-2); }

    /* ---------- viewer stage ---------- */
    .stage {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      background: var(--stage);
      padding: 26px 16px 40px;
    }

    #pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    /* Rendered by pdf.js into a canvas, so the browser's built-in PDF
       handling — including "download instead of open" — never applies. */
    #pages canvas {
      display: block;
      max-width: 100%;
      border-radius: 3px;
      box-shadow: 0 10px 34px -12px rgba(0,0,0,0.55);
      background: #fff;
    }

    .status {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 240px;
      padding: 40px 24px;
      text-align: center;
    }
    .status p {
      margin: 0;
      font-size: 0.92rem;
      color: #D3D8E0;
      max-width: 46ch;
      line-height: 1.6;
    }
    .spinner {
      width: 26px; height: 26px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,0.4); }
    .status .btn:hover { background: #fff; color: var(--ink); border-color: #fff; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    @media (max-width: 560px) {
      .bar { padding: 12px 16px; }
      .bar-title { font-size: 0.94rem; }
      .stage { padding: 16px 10px 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      * { transition: none !important; }
    }
  </style>
</head>

<body>

  <header class="bar">
    <div class="bar-left">
      <a href="index.html" class="back">&larr; Back to homepage</a>
      <h1 class="bar-title">Yuhui Zhang — Curriculum Vitae</h1>
    </div>
    <nav class="bar-actions" aria-label="CV actions">
      <a href="documents/CV.pdf" class="btn" id="open-pdf" target="_blank" rel="noopener">Open PDF</a>
      <a href="documents/CV.pdf" class="btn btn-solid" id="download-pdf" download="Yuhui_Zhang_CV.pdf">Download</a>
    </nav>
  </header>

  <main class="stage">
    <div id="pages" aria-label="Curriculum Vitae"></div>
    <div class="status" id="status">
      <div class="spinner" role="status" aria-label="Loading the CV"></div>
      <p>Loading the CV…</p>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    (function () {
      // Cache-bust at load time, not with a hard-coded version. Replacing the
      // PDF on GitHub then has to be the only step — a stale query string would
      // otherwise keep serving the previous file from the browser cache.
      const FILE = 'documents/CV.pdf?t=' + Date.now();
      const pagesEl = document.getElementById('pages');
      const statusEl = document.getElementById('status');

      ['open-pdf', 'download-pdf'].forEach(function (id) {
        const a = document.getElementById(id);
        if (a) a.href = FILE;
      });

      let settled = false;

      // Last resort: hand the file to the browser's own PDF plugin. Reached only
      // if pdf.js is blocked or never finishes, so the page is never a dead end.
      function fail() {
        if (settled) return;
        settled = true;
        statusEl.innerHTML =
          '<object data="' + FILE + '#view=FitH" type="application/pdf" ' +
          'style="width:100%;height:70vh;border:0;background:#fff;border-radius:3px">' +
          '<p>This browser could not render the CV inline. Open it in a new tab or download it instead.</p>' +
          '<a class="btn" href="' + FILE + '" target="_blank" rel="noopener">Open the CV</a>' +
          '</object>';
        statusEl.style.display = '';
        statusEl.style.minHeight = '0';
      }

      // If pdf.js has not put a page on screen in 12s, stop waiting on it.
      setTimeout(function () {
        if (!pagesEl.querySelector('canvas')) fail();
      }, 12000);

      if (!window.pdfjsLib) { fail(); return; }

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      let pdfDoc = null;
      let renderToken = 0;

      function stageWidth() {
        const stage = document.querySelector('.stage');
        const pad = window.innerWidth <= 560 ? 20 : 32;
        return Math.min(920, Math.max(280, stage.clientWidth - pad));
      }

      async function renderAll() {
        const token = ++renderToken;
        const width = stageWidth();
        // cap the backing store so very dense screens do not blow up memory
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const frag = document.createDocumentFragment();

        for (let n = 1; n <= pdfDoc.numPages; n++) {
          const page = await pdfDoc.getPage(n);
          if (token !== renderToken) return;

          const base = page.getViewport({ scale: 1 });
          const viewport = page.getViewport({ scale: (width / base.width) * dpr });

          const canvas = document.createElement('canvas');
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          canvas.style.width = width + 'px';
          canvas.style.height = Math.floor(viewport.height / dpr) + 'px';
          canvas.setAttribute('role', 'img');
          canvas.setAttribute('aria-label', 'CV page ' + n + ' of ' + pdfDoc.numPages);

          await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
          if (token !== renderToken) return;
          frag.appendChild(canvas);
        }

        if (token !== renderToken) return;
        settled = true;
        pagesEl.innerHTML = '';
        pagesEl.appendChild(frag);
        statusEl.style.display = 'none';
      }

      pdfjsLib.getDocument(FILE).promise
        .then(doc => { pdfDoc = doc; return renderAll(); })
        .catch(fail);

      let resizeTimer = null;
      let lastWidth = window.innerWidth;
      window.addEventListener('resize', function () {
        if (!pdfDoc || window.innerWidth === lastWidth) return;
        lastWidth = window.innerWidth;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(renderAll, 220);
      });
    })();
  </script>
</body>
</html>
